<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mektuplu Sürpriz – Tek HTML</title>
  <style>
    :root{
      --bg1:#fff1f2; --bg2:#fde2e4; --ink:#1f2937; --accent:#ef476f;
      --paper:#fffaf0; --env:#f8d2a0; --env-shadow:#d9b37f; 
      --btn:#111827; --btnText:#fff; --petal:#ff4d6d; --stem:#1f9d55; --leaf:#3bbf78;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      color:var(--ink);
      background: radial-gradient(1200px 800px at 50% -10%, var(--bg2), var(--bg1) 50%);
      display:grid; place-items:center;
    }
    .app{width:min(900px, 92vw);}
    .stack{display:grid; gap:20px;}
    .envelope{
      width:min(520px, 92vw);
      margin-inline:auto;
      aspect-ratio:4/3;
      position:relative;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,.15));
      cursor:pointer;
      user-select:none;
    }
    .env-body{
      position:absolute; inset:0; border-radius:14px; background:linear-gradient(180deg, var(--env), var(--env-shadow));
      overflow:hidden;
    }
    .env-flap{
      position:absolute; inset:0; clip-path:polygon(0 0, 100% 0, 50% 60%);
      background:linear-gradient(180deg, #ffd8a6, #f4c37c 60%, #e7b164);
      transform-origin:50% 0%;
      transform:rotateX(0deg);
      transition:transform .8s cubic-bezier(.2,.9,.18,1.1);
      border-top-left-radius:14px; border-top-right-radius:14px;
    }
    .env-flap::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,#ffe5bf,#ffcf8a); clip-path:polygon(0 0, 100% 0, 50% 60%); filter:brightness(1.05);}
    .paper{
      --pad:22px;
      position:absolute; left:6%; right:6%; bottom:6%; top:28%;
      background:var(--paper); border-radius:12px; padding:var(--pad);
      box-shadow: 0 10px 25px rgba(0,0,0,.15);
      transform: translateY(65%);
      transition: transform .9s cubic-bezier(.2,.9,.18,1.1);
      display:flex; flex-direction:column; gap:10px; justify-content:space-between;
      opacity:0; transition-property:transform,opacity;
    }
    .paper h2{margin:0 0 8px; font-size:clamp(18px, 2.3vw, 26px);}
    .paper p{margin:0; line-height:1.6; font-size:clamp(14px, 1.9vw, 18px);}
    .mini-icon{align-self:center; margin-top:8px; opacity:.9; display:inline-grid; place-items:center; width:58px; height:46px; border-radius:10px; background:#fff3; transition:transform .25s ease, filter .25s ease; cursor:pointer; user-select:none;}
    .mini-icon:hover{ transform:translateY(-2px); filter:brightness(1.06);}
    .envelope.open .env-flap{ transform:rotateX(168deg);}
    .envelope.open .paper{ transform: translateY(-6%); opacity:1;}
    .area{display:none;}
    .area.show{display:block;}
    .btn{display:inline-flex; align-items:center; gap:.6rem; background:var(--btn); color:var(--btnText); padding:12px 18px; border-radius:999px; border:none; cursor:pointer; font-weight:700; letter-spacing:.2px; box-shadow:0 8px 16px rgba(0,0,0,.15); transition:transform .08s ease, box-shadow .2s ease, opacity .3s ease;}
    .btn:active{ transform:translateY(1px);}
/* Flower wrap */
.flower-wrap {
  display: grid;
  place-items: center;
  margin-top: 20px;
  height: 350px;
}

/* Sap */
.stem {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 6px;
  height: 0;
  background: var(--stem);
  border-radius: 3px;
  transition: height 1s ease;
  transform: translateX(-50%);
}

/* Yapraklar */
.leaf {
  position: absolute;
  width: 60px;
  height: 35px;
  background: var(--leaf);
  border-radius: 50% 50% 50% 0;
  opacity: 0;
  transform: scale(0.6);
  transition: opacity .5s ease, transform .5s ease;
}
.leaf.left {
  left: 50%;
  bottom: 50px;
  transform-origin: 100% 50%;
  rotate: -45deg;
  translate(-70%,0);
}
.leaf.right {
  left: 50%;
  bottom: 50px;
  transform-origin: 0% 50%;
  rotate: 45deg;
  translate(10%,0);
}

/* Çiçek merkezi */
.flower-center {
  position: absolute;
  top: 0;
  left: 50%;
  width: 0;
  height: 0;
  background: #ffd166;
  border-radius: 50%;
  transition: width .5s ease, height .5s ease;
  transform: translateX(-50%);
}

/* Petals */
.petals {
  position: absolute;
  top: 0;
  left: 50%;
  width: 0;
  height: 0;
  transform: translateX(-50%);
}
.petal {
  position: absolute;
  width: 40px;
  height: 60px;
  background: var(--petal);
  border-radius: 50%;
  opacity: 0;
  transform: scale(0.2);
  transition: opacity .5s ease .3s, transform .5s ease .3s;
}
.p1{transform: rotate(0deg) translateY(-20px) scale(0.2);}
.p2{transform: rotate(60deg) translateY(-20px) scale(0.2);}
.p3{transform: rotate(120deg) translateY(-20px) scale(0.2);}
.p4{transform: rotate(180deg) translateY(-20px) scale(0.2);}
.p5{transform: rotate(240deg) translateY(-20px) scale(0.2);}
.p6{transform: rotate(300deg) translateY(-20px) scale(0.2);}

/* Büyüme animasyonu */
.grow .stem {height: 120px;}
.grow .leaf {opacity: 1; transform: scale(1);}
.grow .flower-center {width: 40px; height: 40px;}
.grow .petal {opacity: 1; transform: scale(1);}
    .credits{opacity:.55; text-align:center; font-size:12px; margin-top:18px;}
  </style>
</head>
<body>
<main class="app">
<div class="stack">
  <section>
    <div id="env1" class="envelope">
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="paper">
        <div>
          <h2 id="paper1Title"></h2>
          <p id="paper1Text"></p>
        </div>
        <div id="toSecond" class="mini-icon" title="Bir mektup daha">
          <svg width="28" height="24" viewBox="0 0 28 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="5" width="26" height="16" rx="3" fill="#fcd9a9" stroke="#d1a870"/>
            <path d="M2 6l12 9L26 6" stroke="#a2763f" stroke-width="2"/>
          </svg>
        </div>
      </div>
    </div>
  </section>

  <section id="area2" class="area">
    <div id="env2" class="envelope">
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="paper">
        <div>
          <h2 id="paper2Title"></h2>
          <p id="paper2Text"></p>
        </div>
        <button id="growBtn" class="btn">
          <span>Buraya basman gereken konular var.</span>
        </button>
      </div>
    </div>
<div class="flower-wrap">
  <div id="flower" class="flower">
    <!-- Sap -->
    <div class="stem"></div>
    <!-- Yapraklar -->
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    <!-- Çiçek merkezi -->
    <div class="flower-center"></div>
    <!-- Yapraklar (petals) -->
    <div class="petals">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
    </div>
  </div>
</div>
  </div>
  <div id="noteLine" class="note-line"></div>
</div>
      </div>
      <div id="noteLine" class="note-line"></div>
    </div>
    <audio id="music" preload="auto">
      <source src="song.mp3" type="audio/mpeg" />
      <source src="song.ogg" type="audio/ogg" />
    </audio>
  </section>
  <p class="credits">Kod: tek HTML/CSS/JS. Yazıları, müziği ve renkleri aşağıdaki yapılandırmadan düzenleyebilirsin.</p>
</div>
</main>

<script>
const CONFIG = {
  paper1: { title: "Sevgili İnci'ye", text: "Bu mektubu açtığında küçük bir sürpriz başlıyor. Her satırda içimden geçenleri sakladım."},
  paper2: { title: "İkinci Not", text: "Şimdi sadece çiçeğe odaklanabilirsin."},
  finalNote: "Seni düşündüğüm her an, içimde böyle çiçekler açıyor.",
  audioVolume: 0.9
};

const $ = (sel, root=document) => root.querySelector(sel);
const env1 = $('#env1'), env2 = $('#env2'), toSecond = $('#toSecond');
const growBtn = $('#growBtn'), flower = $('#flower'), music = $('#music'), noteLine = $('#noteLine');
let grown = false;

$('#paper1Title').textContent = CONFIG.paper1.title;
$('#paper1Text').textContent = CONFIG.paper1.text;
$('#paper2Title').textContent = CONFIG.paper2.title;
$('#paper2Text').textContent = CONFIG.paper2.text;
noteLine.textContent = CONFIG.finalNote;

// İlk mektup açma
env1.addEventListener('click', e => {
  if(e.target.closest('#toSecond')) return;
  env1.classList.toggle('open');
});
// İkinci mektuba geçiş// 2. mektuba geçiş
toSecond.addEventListener('click', e => {
  e.stopPropagation();
  env1.parentElement.style.display = 'none'; // İlk mektup kaybolsun
  area2.classList.add('show');               // 2. mektup görünür olsun
  env2.style.display = 'block';             // ikinci mektup görünür
  flower.style.display = 'none';            // çiçek gizli
  area2.scrollIntoView({behavior:'smooth', block:'start'});
});

// 2. mektup aç/kapa
env2.addEventListener('click', e => {
  if(e.target.closest('#growBtn')) return; // butona basınca aç/kapa olmasın
  env2.classList.toggle('open');           // tıkla aç/kapa
});

growBtn.addEventListener('click', async ()=>{
  env2.style.display = 'none'; // 2. mektup kaybolsun
  flower.style.display = 'block'; // çiçek gösterilsin
  if(!grown){
    flower.style.transform = 'scale(0)';
    flower.style.opacity = '0';
    requestAnimationFrame(()=>{
      flower.style.transform = 'scale(1)';
      flower.style.opacity = '1';
      flower.classList.add('grow');
    });
    grown = true;
  }
  try{ 
    music.volume = CONFIG.audioVolume; 
    await music.play(); 
  }catch(err){console.warn(err);}
  $('.flower-wrap').scrollIntoView({behavior:'smooth', block:'center'});
});

// Space ile ilk mektup aç/kapa
document.addEventListener('keydown', e=>{
  if(e.code==='Space' && !e.repeat){ env1.classList.toggle('open'); e.preventDefault();}
});
</script>
</body>
</html>
