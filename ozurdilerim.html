<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>özür dilerim...</title>
  <style>
    :root{
      --bg1:#fff1f2; --bg2:#fde2e4; --ink:#1f2937; --accent:#ef476f;
      --paper:#fffaf0; --env:#f8d2a0; --env-shadow:#d9b37f; 
      --btn:#111827; --btnText:#fff;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      color:var(--ink);
      background: radial-gradient(1200px 800px at 50% -10%, var(--bg2), var(--bg1) 50%);
      display:grid; place-items:center;
    }
    .app{width:min(900px, 92vw);}
    .stack{display:grid; gap:20px;}
    .envelope{
      width:min(520px, 92vw);
      margin-inline:auto;
      aspect-ratio:4/3;
      position:relative;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,.15));
      cursor:pointer;
      user-select:none;
    }
    .env-body{
      position:absolute; inset:0; border-radius:14px; background:linear-gradient(180deg, var(--env), var(--env-shadow));
      overflow:hidden;
    }
    .env-flap{
      position:absolute; inset:0; clip-path:polygon(0 0, 100% 0, 50% 60%);
      background:linear-gradient(180deg, #ffd8a6, #f4c37c 60%, #e7b164);
      transform-origin:50% 0%;
      transform:rotateX(0deg);
      transition:transform .8s cubic-bezier(.2,.9,.18,1.1);
      border-top-left-radius:14px; border-top-right-radius:14px;
    }
    .env-flap::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,#ffe5bf,#ffcf8a); clip-path:polygon(0 0, 100% 0, 50% 60%); filter:brightness(1.05);}
.paper {
  --pad:22px;
  position: fixed;        /* ekranın her zaman sabit */
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);  /* ortada başlar, scale ile animasyon */
  width: 88%;
  max-width: 480px;
  height: 70%;            /* mobil uyumlu boyut */
  max-height: 600px;
  background: var(--paper);
  border-radius: 12px;
  padding: var(--pad);
  box-shadow: 0 10px 25px rgba(0,0,0,.15);
  display: flex;
  flex-direction: column;
  gap: 10px;
  justify-content: space-between;
  opacity: 0;
  transition: transform .6s cubic-bezier(.2,.9,.18,1.1), opacity .6s ease;
  overflow-y: auto;
  z-index: 999;           /* her zaman üstte */
}
.paper::-webkit-scrollbar {
  width: 8px;                /* scroll genişliği */
}

.paper::-webkit-scrollbar-track {
  background: #f0e6d2;       /* track rengi */
  border-radius: 6px;
}

.paper::-webkit-scrollbar-thumb {
  background: #c49b6d;       /* kaydırıcı rengi */
  border-radius: 6px;
}

.paper::-webkit-scrollbar-thumb:hover {
  background: #a67c4e;
}

.envelope.open .paper {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);  /* açılınca tam ortada */
}
    .mini-icon{align-self:center; margin-top:8px; opacity:.9; display:inline-grid; place-items:center; width:58px; height:46px; border-radius:10px; background:#fff3; transition:transform .25s ease, filter .25s ease; cursor:pointer; user-select:none;}
    .mini-icon:hover{ transform:translateY(-2px); filter:brightness(1.06);}
    .envelope.open .env-flap{ transform:rotateX(168deg);}
    .envelope.open .paper{ transform: translate(-50%, -50%) scale(1); opacity:1;}
    .area{display:none;}
    .area.show{display:block;}
    .btn{display:inline-flex; align-items:center; gap:.6rem; background:var(--btn); color:var(--btnText); padding:12px 18px; border-radius:999px; border:none; cursor:pointer; font-weight:700; letter-spacing:.2px; box-shadow:0 8px 16px rgba(0,0,0,.15); transition:transform .08s ease, box-shadow .2s ease, opacity .3s ease;}
    .btn:active{ transform:translateY(1px);}
    .flower-wrap{
      display:grid; place-items:center; height:300px; margin-top:10px;
    }
    #surpriseGif{
      display:none; width:200px; height:auto;
    }
    .note-line{
      margin-top:6px;
      font-weight:600;
      text-align:center;
      opacity:0;
      transition:opacity .6s ease 0.3s;
    }
    .show-note{opacity:1;}
    .credits{opacity:.55; text-align:center; font-size:12px; margin-top:18px;}
  </style>
</head>
<body>
<main class="app">
<div class="stack">
  <section>
    <div id="env1" class="envelope">
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="paper">
        <div>
          <h2 id="paper1Title"></h2>
          <p id="paper1Text"></p>
        </div>
        <div id="toSecond" class="mini-icon" title="Bir mektup daha">
          <svg width="28" height="24" viewBox="0 0 28 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="5" width="26" height="16" rx="3" fill="#fcd9a9" stroke="#d1a870"/>
            <path d="M2 6l12 9L26 6" stroke="#a2763f" stroke-width="2"/>
          </svg>
        </div>
      </div>
    </div>
  </section>

  <section id="area2" class="area">
    <div id="env2" class="envelope">
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="paper">
        <div>
          <h2 id="paper2Title"></h2>
          <p id="paper2Text"></p>
        </div>
        <button id="growBtn" class="btn">
          <span>Buraya basman gereken konular var.</span>
        </button>
      </div>
    </div>
    <div class="flower-wrap">
      <img id="surpriseGif" src="cicek.png" />
      <div id="noteLine" class="note-line"></div>
    </div>
    <audio id="music" preload="auto">
      <source src="song.mp3" type="audio/mpeg" />
      <source src="song.ogg" type="audio/ogg" />
    </audio>
  </section>
  <p class="credits">Mektuba basarak mektubu açabilirsin. Made By zaza/echopast</p>
</div>
</main>

<script>
const CONFIG = {
  paper1: { title: "AŞIĞIM ULAN AŞIK!", text: "Bu gün günlerden 24 Ağustos 2025, saat 04.44... Aşkım biricik sevgilim hayatımın anlamı uyuyor, fakat bana küs bir şekilde uyuyor. Ben ise özür niyetine bu siteyi yapıyorum. Ahh... Bu gece uyku yok. Her neyse benim sevgilime değer. Bu mektubumda yavruma olan aşkımı anlatacağım. Tarih 19 Eylül 2024, Gaziantep Kültür Yolu Festivalinde Festival Parkda Haluk Levent'in konseri vardı. Ama iki genç bu konsere gitmemişti onun yerine ailelerine Haluk Levent konserine gidicez diye yalan söyleyip buluşmuşlardı. Masal Parkı Şatosunda... Mert eşeğe biniyor, İnci şirin babayla fotoğraf çekiniyor şirin babayı çocukları yapıyorlar (ne alaka amk ben daha çözemedim) her neyse. İnci Mertden birşey bekliyordu ama Mert de o beklediği şeyi Dedüblüman konserinde yapmak istiyordu. Mert İncinin sevgili olmak için beklediğini fark edince o da hemen daha fazla beklemeden yapıştırdı 'BENİMLE ÇIKAR MISIN İNCİ' İnci ise ilk reddetti ama sonra kabul etti. 11 aylık serüven böyle başladı. Neyse hikaye kitabı yazmicam olayların nasıl başladığını bil istedim. Yavrum sen bu hayatıma girdiğin 11 aydan beri benim hayatımı da beni de çok değiştirdin. Senin sayende ilk defa sevildim sevdim. (keşke daha fazla belli etsen) Senin sayende iyi dost kötü dost ayırt ettim. Ben senin her zaman iyi gününde de kötü gününde de yanında olmaya çalıştım. Ben seni sana yemin ederim ki sadece sevgilim olarak görmüyorum ben seni yakın arkadaşım, kardeşim, bacım, karım, sevgilim, annem, ablam her türlü yerin var bende. Yavrum iyi ki varsın iyi ki benimsin. Senden hiçbir zaman ayrılmicam yani hiçbir şekilde benden kurtulamazsın her zaman sevgilim olacaksın. Belki evlilikte karı koca olmak düşünülür... Diğer mektupa geçebilirsin."},
  paper2: { title: "ÖZÜR DİLERİM YAVRUUMMMM", text: "Yavrum ben seni üzmek istemedim. Gaziraya bindik binmeden önce aramak istedim sen istemedin. Gaziraya bindik Adliyede indiğimizde tramvay geçmiyordu ve taksi çağırdık. Taksi bizim evi bilmediği için önde de ben oturduğum için konumu açtım ve sen yazmışsın görmedim. Adam da bişi söylemedi şerefsiz. Ama neyse olan oldu haklısın birtanem binemeden önce sana yazmam gerekirdi. Yavrum bu gece benle küs uyudun dün gece sesini duyamadım bu gün sesini duyamadım ben seni çok özledim. Beni affet sevgilim özür dilerim. Lütfen bir daha küs uyumayalım. Aşağıdaki butona bir hediye koydum lütfen bas ve hediyeni gör..."},
  finalNote: "Şey, param olmadığı için çiçek alamıyorum. Bu yüzden max bu kadar oluyor...",
  audioVolume: 0.9
};

const $ = (sel, root=document) => root.querySelector(sel);
const env1 = $('#env1'), env2 = $('#env2'), toSecond = $('#toSecond');
const growBtn = $('#growBtn'), music = $('#music');

$('#paper1Title').textContent = CONFIG.paper1.title;
$('#paper1Text').textContent = CONFIG.paper1.text;
$('#paper2Title').textContent = CONFIG.paper2.title;
$('#paper2Text').textContent = CONFIG.paper2.text;
$('#noteLine').textContent = CONFIG.finalNote;

// İlk mektup açma
env1.addEventListener('click', e => {
  if(e.target.closest('#toSecond')) return;
  env1.classList.toggle('open');
});

// 2. mektuba geçiş
toSecond.addEventListener('click', e => {
  e.stopPropagation();
  env1.parentElement.style.display = 'none';
  $('#area2').classList.add('show');
  env2.style.display = 'block';
  $('#surpriseGif').style.display = 'none';
  $('#area2').scrollIntoView({behavior:'smooth', block:'start'});
});

// 2. mektup aç/kapa
env2.addEventListener('click', e => {
  if(e.target.closest('#growBtn')) return;
  env2.classList.toggle('open');
});

// Butona basınca GIF göster
growBtn.addEventListener('click', async ()=>{
  env2.style.display = 'none';
  const gif = $('#surpriseGif');
  gif.style.display = 'block';
  $('#noteLine').classList.add('show-note');
  try{ 
    music.volume = CONFIG.audioVolume; 
    await music.play(); 
  }catch(err){console.warn(err);}
  $('.flower-wrap').scrollIntoView({behavior:'smooth', block:'center'});
});

// Space ile ilk mektup aç/kapa
document.addEventListener('keydown', e=>{
  if(e.code==='Space' && !e.repeat){ env1.classList.toggle('open'); e.preventDefault();}
});
</script>
</body>
</html>
